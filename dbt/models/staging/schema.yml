version: 2

models:
  - name: stg_trades
    description: >
      Cleaned and typed trade orders. One row per trade.
      Excludes rows with null trade_id.
    columns:
      - name: trade_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: instrument_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_instruments')
              field: instrument_id
      - name: trade_type
        tests:
          - not_null
          - accepted_values:
              values: [buy, sell]
      - name: quantity
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: [filled, pending, cancelled]

  - name: stg_users
    description: Cleaned platform users.
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: account_type
        tests:
          - accepted_values:
              values: [standard, premium, institutional]
      - name: risk_profile
        tests:
          - accepted_values:
              values: [low, moderate, high]

  - name: stg_instruments
    description: Cleaned financial instruments.
    columns:
      - name: instrument_id
        tests: [not_null, unique]
      - name: instrument_type
        tests:
          - accepted_values:
              values: [equity, forex, crypto, etf, commodity]

  - name: stg_transactions
    description: Cleaned financial transactions (settlements + deposits).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: transaction_type
        tests:
          - accepted_values:
              values: [trade_settlement, deposit, withdrawal, fee]

  - name: stg_risk_events
    description: Cleaned compliance and risk events.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: severity
        tests:
          - not_null
          - accepted_values:
              values: [low, medium, high]
